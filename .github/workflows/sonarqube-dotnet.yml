name: SonarQube .NET Analysis

on:
  push:
    branches:
      - main
      - dotnet
    paths:
      - 'sem5pi/MDR/**'  # Only trigger SonarQube .NET analysis when files in sem5pi/MDR change
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dotnet
    paths:
      - 'sem5pi/MDR/**'  # Only trigger SonarQube .NET analysis when files in sem5pi/MDR change

jobs:
  sonarqube-dotnet:
    name: SonarQube .NET Analysis
    runs-on: macos-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'
      - name: Install SonarScanner tool
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Install dotnet-coverage
        run: |
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Run SonarScanner analysis with test coverage
        run: |
          # Remove sonar-project.properties if it exists
          rm -f sonar-project.properties

          dotnet sonarscanner begin /k:"ruivieira03_Projeto-Estagio-Teste" /o:"ruivieira03" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="sem5pi/MDR/coverage.xml"

          # Build the project
          dotnet build sem5pi/MDR/sem5pi-24-25-g034.sln --no-incremental

          # Run tests and collect coverage
          dotnet test sem5pi/MDR/sem5pi-24-25-g034.sln \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=sem5pi/MDR/TestResults/coverage/

          # Generate a report
          reportgenerator \
            -reports:sem5pi/MDR/TestResults/coverage/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Cobertura

          # End SonarScanner analysis
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
